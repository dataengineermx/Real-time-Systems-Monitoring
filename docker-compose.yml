services:

  # ============================================================
  # PostgreSQL - CDC SOURCE
  # ============================================================
  postgres:
    image: postgres:18
    container_name: debezium-postgres
    hostname: postgres

    ports:
      - "${POSTGRES_PORT}:5432"

    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

    command:
      - postgres
      - -c
      - wal_level=logical
      - -c
      - max_wal_senders=10
      - -c
      - max_replication_slots=10

    volumes:
      - postgres_data:/var/lib/postgresql

    networks:
      - debezium-network

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"
        ]
      interval: 5s
      timeout: 5s
      retries: 20


  # ============================================================
  # KAFKA - KRaft
  # ============================================================
  kafka:
    image: apache/kafka:4.0.0
    container_name: debezium-kafka
    hostname: kafka

    ports:
      - "${KAFKA_PORT}:9092"

    environment:

      # KRaft
      KAFKA_NODE_ID: ${KAFKA_NODE_ID}
      KAFKA_PROCESS_ROLES: broker,controller

      KAFKA_CONTROLLER_QUORUM_VOTERS: ${KAFKA_NODE_ID}@kafka:9093

      # Listeners
      KAFKA_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://0.0.0.0:9092,CONTROLLER://kafka:9093

      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:${KAFKA_PORT}

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT

      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL

      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER

      # Single node
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

      KAFKA_NUM_PARTITIONS: 3

      # Retention
      KAFKA_LOG_RETENTION_HOURS: 168

    volumes:
      - kafka_data:/var/lib/kafka/data

    networks:
      - debezium-network


  # ============================================================
  # KAFKA CONNECT + DEBEZIUM
  # ============================================================
  connect:
    image: quay.io/debezium/connect:3.4
    container_name: debezium-connect
    hostname: connect

    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started

    ports:
      - "${CONNECT_PORT}:8083"

    environment:

      # Kafka
      BOOTSTRAP_SERVERS: kafka:29092

      # Kafka Connect
      GROUP_ID: 1

      CONFIG_STORAGE_TOPIC: connect_configs
      OFFSET_STORAGE_TOPIC: connect_offsets
      STATUS_STORAGE_TOPIC: connect_status

      CONFIG_STORAGE_REPLICATION_FACTOR: 1
      OFFSET_STORAGE_REPLICATION_FACTOR: 1
      STATUS_STORAGE_REPLICATION_FACTOR: 1

      # JSON converters
      KEY_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      VALUE_CONVERTER: org.apache.kafka.connect.json.JsonConverter

      KEY_CONVERTER_SCHEMAS_ENABLE: "false"
      VALUE_CONVERTER_SCHEMAS_ENABLE: "false"

      # REST API
      REST_ADVERTISED_HOST_NAME: connect
      REST_PORT: 8083

    networks:
      - debezium-network


  # ============================================================
  # AIRFLOW METADATA DATABASE
  # ============================================================
  airflow-postgres:
    image: postgres:18
    container_name: airflow-postgres
    hostname: airflow-postgres

    environment:
      POSTGRES_USER: ${AIRFLOW_POSTGRES_USER}
      POSTGRES_PASSWORD: ${AIRFLOW_POSTGRES_PASSWORD}
      POSTGRES_DB: ${AIRFLOW_POSTGRES_DB}

    volumes:
      - airflow_postgres_data:/var/lib/postgresql

    networks:
      - debezium-network

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${AIRFLOW_POSTGRES_USER} -d ${AIRFLOW_POSTGRES_DB}"
        ]
      interval: 5s
      timeout: 5s
      retries: 20


  # ============================================================
  # AIRFLOW
  # ============================================================
  airflow:
    image: ${AIRFLOW_IMAGE_NAME}
    container_name: airflow
    hostname: airflow

    depends_on:
      airflow-postgres:
        condition: service_healthy

    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: >-
        postgresql+psycopg2://${AIRFLOW_POSTGRES_USER}:${AIRFLOW_POSTGRES_PASSWORD}@airflow-postgres:5432/${AIRFLOW_POSTGRES_DB}

      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__API__AUTH_BACKENDS: airflow.api.auth.backend.basic_auth
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"

    ports:
      - "${AIRFLOW_PORT}:8080"

    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/plugins:/opt/airflow/plugins
      - ./airflow/config:/opt/airflow/config

    networks:
      - debezium-network

    command: standalone



# ============================================================
# NETWORK
# ============================================================
networks:
  debezium-network:
    name: debezium-network


# ============================================================
# VOLUMES
# ============================================================
volumes:
  postgres_data:
  kafka_data:
  airflow_postgres_data:
